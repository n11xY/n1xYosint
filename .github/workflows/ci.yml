name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, so a newly published vulnerability in a dependency shows up
  # even in a week with no commits.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install "ruff>=0.6"
      # Rules come from [tool.ruff] in pyproject.toml: real errors, not style.
      - name: Ruff
        run: ruff check osintrecon tests

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # pip itself is audited too; the runner's copy can lag behind a fix.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,imagehash]"
      # Known vulnerabilities in everything installed, including the
      # optional Pillow/imagehash used by avatar correlation. The package
      # itself isn't on PyPI, so it's skipped rather than reported.
      - name: pip-audit
        run: pip-audit --skip-editable --progress-spinner off
