[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n1xYosint"
version = "0.1.0"
description = "Modular, CLI-first OSINT reconnaissance framework for username/email intelligence gathering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
holehe = ["holehe", "httpx"]
webapp = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
]

[project.scripts]
n1xyosint = "osintrecon.cli:main"

[tool.setuptools.packages.find]
include = ["osintrecon*", "webapp*"]

[tool.setuptools.package-data]
osintrecon = []
webapp = ["templates/*.html", "static/*.css", "static/*.js"]
