[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n1xYosint"
version = "0.1.0"
description = "Modular, CLI-first OSINT reconnaissance framework for username/email/phone intelligence gathering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "PyYAML>=6.0",
    "rich>=13.7",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
# Pillow/imagehash included here too (not just in the `imagehash` extra
# below) so CI's `pip install -e ".[dev]"` actually exercises
# test_avatar_correlation.py instead of it silently skipping everywhere.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "Pillow>=10.0", "imagehash>=4.3"]
holehe = ["holehe", "httpx"]
imagehash = ["Pillow>=10.0", "imagehash>=4.3"]

[project.scripts]
n1xyosint = "osintrecon.cli:main"

[tool.setuptools.packages.find]
include = ["osintrecon*"]

[tool.setuptools.package-data]
osintrecon = []
