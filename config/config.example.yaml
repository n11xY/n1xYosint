# n1xYosint example configuration.
# Copy to config.yaml and edit, or pass --config /path/to/this/file.

concurrency: 20               # max overall concurrent in-flight requests
timeout_seconds: 10
retries: 2
retry_backoff: 1.5            # exponential backoff multiplier between retries
rate_limit_per_source: 5      # max concurrent requests to any single source module
max_enrichment_identifiers: 200  # safety cap on total identifiers when using --depth > 1

user_agent: "n1xYosint/0.1 (+authorized OSINT research)"

# Route all traffic through a proxy. Examples:
#   proxy: "http://127.0.0.1:8080"       # HTTP/HTTPS proxy (e.g. Burp)
#   proxy: "socks5h://127.0.0.1:9050"    # Tor (requires: sudo apt install tor && systemctl start tor)
proxy: null

headers: {}
  # X-Custom-Header: "value"

cache:
  enabled: true
  path: "~/.cache/n1xYosint/cache.sqlite3"
  ttl_seconds: 86400           # 24h

evidence:
  save_raw: false              # set true (or --save-evidence) to persist raw responses
  path: "~/.local/share/n1xYosint/evidence"

logging:
  level: INFO
  file: null                   # e.g. "~/.local/share/n1xYosint/run.log"

# Extra directory to load third-party/custom plugin modules from.
plugins_dir: null

sources:
  username_sites:
    enabled: true
    sites_db: null            # defaults to config/sites.json bundled with the framework

  sherlock:
    enabled: true              # ~480 sites from Sherlock's live database -- adds real time to a scan
    concurrency: 25             # max concurrent site checks within this one module
    include_nsfw: false         # Sherlock flags ~19 adult sites; excluded by default

  github:
    enabled: true
    api_key: null              # optional GitHub PAT, raises API rate limit (not required)

  gitlab:
    enabled: true

  gravatar:
    enabled: true

  pastebin_search:
    enabled: true

  xposedornot:
    enabled: true               # free, no key needed -- HIBP alternative (breach exposure only)

  hibp:
    enabled: true
    api_key: null               # paid (~$4.39/mo): https://haveibeenpwned.com/API/Key
                                 # (or set env var OSINTRECON_HIBP_API_KEY)
                                 # covers both breach exposure and paste exposure;
                                 # more complete than xposedornot but not free

  search_api:
    enabled: false               # disabled by default: requires a paid Bing Web Search API key
    provider: bing
    api_key: null                # or env var OSINTRECON_SEARCH_API_API_KEY
    results_per_query: 10

  # -- Credential-gated sources that upgrade a heuristic HTML check into a
  # -- definitive (CONFIRMED) official-API result. All are free to sign up
  # -- for and, except twitter_api, work fine on the free tier.
  # -- Left unconfigured, they're skipped silently -- no need to disable them.

  twitch_api:
    client_id: null              # https://dev.twitch.tv/console/apps (free)
    client_secret: null

  steam_api:
    api_key: null                # https://steamcommunity.com/dev/apikey (free)

  hunter_io:
    api_key: null                # https://hunter.io/api-keys (free tier available)

  emailrep:
    api_key: null                # optional: https://emailrep.io/key -- works unauthenticated too

  twitter_api:
    enabled: false                # disabled by default: X API v2 access requires a paid developer tier
    bearer_token: null            # https://developer.x.com

  # "Configured" here means the optional packages are installed:
  # pip install -e ".[holehe]" (or: pip install holehe httpx)
  # Not installed -> skipped silently, same as any unconfigured source.
  holehe: {}
